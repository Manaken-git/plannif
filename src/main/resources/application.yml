spring:
  application:
    name: plannif

  datasource:
    url: jdbc:mariadb://localhost:3306/planning_ecole
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: none
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MariaDBDialect
          format_sql: true
          show_sql: true
    logging:
      level:
        org.hibernate.SQL: ERROR
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
server:
  port: 8080

logging:
  liquibase.ui: TRACE
