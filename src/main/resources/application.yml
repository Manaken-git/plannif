spring:
  application:
    name: plannif

  datasource:
    url: jdbc:mariadb://localhost:3306/planning_ecole
    username: root
    password: root
    driver-class-name: org.mariadb.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: update
      properties:
        hibernate:
          dialect: org.hibernate.dialect.MariaDBDialect
          format_sql: true
          show_sql: true
    logging:
      level:
        org.hibernate.SQL: DEBUG
        org.hibernate.type.descriptor.sql.BasicBinder: TRACE

server:
  port: 8080
